<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    </head>
    <body>
        <div class="menu" >
            <ul>
                <li class="profile">
                    <div class="img-box">
                        <img src="pro.jpg" alt="profile">
                    </div>
                    <h2>Sara</h2>
                </li>
                <li>
                    <a  class="active" href="a">
                        
                        <i class="fa-solid fa-house"></i>
                        <p>Dashboard</p>
                    </a>
                </li>
                <li>
                    <a href="a">
                        
                        <i class="fa-solid fa-user-group"></i>
                        <p>Clients</p>
                    </a>
                </li>
                <li>
                    <a href="a">
                        
                        <i class="fa-solid fa-table"></i>
                        <p>Products</p>
                    </a>
                </li>
                <li>
                    <a href="a">
                        
                        <i class="fa-solid fa-chart-pie"></i>
                        <p>charts</p>
                    </a>
                </li>
                <li>
                    <a href="a">
                        
                        <i class="fa-solid fa-pen"></i>
                        <p>Posts</p>
                    </a>
                </li>
                <li>
                    <a href="a">
                        
                        <i class="fa-solid fa-star"></i>
                        <p>Favorite</p>
                    </a>
                </li>
                <li>
                    <a href="a">
                        
                        <i class="fa-solid fa-cog"></i>
                        <p>Settings</p>
                    </a>
                </li>
                <li class="log-out">
                    <a href="a">
                        
                        <i class="fa-solid fa-sign-out"></i>
                        <p>Log Out</p>
                    </a>
                </li>

            </ul>

        </div>
        <div class="content">
            <div class="title-info">
                <p>dashboard</p>
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="data-info">
                <div class="box">
                    <i class="fas fa-user"></i>
                    <div class="data">
                        <p>user</p>
                        <span>100</span>
                    </div>
                </div>
                <div class="box">
                    <i class="fas fa-pen"></i>
                    <div class="data">
                        <p>posts</p>
                        <span>870</span>
                    </div>
                </div>
                <div class="box">
                    <i class="fas fa-table"></i>
                    <div class="data">
                        <p>products</p>
                        <span>34</span>
                    </div>
                </div>
                <div class="box">
                    <i class="fas fa-dollar"></i>
                    <div class="data">
                        <p>revenue</p>
                        <span>$124</span>
                    </div>
                </div>
            </div>

            <div class="title-info">
                <p>products</p>
                <i class="fas fa-table"></i>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>product</th>
                        <th>price</th>
                        <th>count</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>tv</td>
                        <td><span class="price">$125</span></td>
                        <td><span class="count">50</span></td>
                        </tr>
                        <td>phone</td>
                        <td><span class="price">$200</span></td>
                        <td><span class="count">30</span></td>
                    </tr>
                    <tr>
                        <td>labtop</td>
                        <td><span class="price">$450</span></td>
                        <td><span class="count">22</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>

</html>
